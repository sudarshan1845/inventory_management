{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product{% endblock %}
{% block content %}
<h1>{{ 'Edit' if product else 'Add' }} Product</h1>
<form class="form-card" method="POST">
  <label>Product Name</label>
  <input type="text" name="name" required value="{{ product.name if product else '' }}">

  <label>Category</label>
  <select name="category_id">
    <option value="">-- Select --</option>
    {% for c in categories %}
    <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
    {% endfor %}
  </select>

  <label>Supplier</label>
  <select name="supplier_id">
    <option value="">-- Select --</option>
    {% for s in suppliers %}
    <option value="{{ s.id }}" {% if product and product.supplier_id == s.id %}selected{% endif %}>{{ s.name }}</option>
    {% endfor %}
  </select>

  <div class="form-row">
    <div>
      <label>Selling Price (₹)</label>
      <input type="number" step="0.01" name="price" required value="{{ product.price if product else '' }}">
    </div>
    <div>
      <label>Cost Price (₹)</label>
      <input type="number" step="0.01" name="cost_price" required value="{{ product.cost_price if product else '' }}">
    </div>
  </div>

  <div class="form-row">
    <div>
      <label>Quantity</label>
      <input type="number" name="quantity" required value="{{ product.quantity if product else 0 }}">
    </div>
    <div>
      <label>Minimum Stock (reorder level)</label>
      <input type="number" name="min_stock" required value="{{ product.min_stock if product else 5 }}">
    </div>
  </div>

  <label>Expiry Date (optional)</label>
  <input type="date" name="expiry_date" value="{{ product.expiry_date if product else '' }}">

  <button class="btn" type="submit">{{ 'Update' if product else 'Save' }} Product</button>
  <a class="btn secondary" href="{{ url_for('products') }}">Cancel</a>
</form>
{% endblock %}
