{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<h1>📈 Reports & Charts</h1>

<div class="panel-grid">
  <div class="panel">
    <h3>Sales - Last 7 Days</h3>
    <canvas id="salesChart"></canvas>
  </div>
  <div class="panel">
    <h3>Stock by Category</h3>
    <canvas id="stockChart"></canvas>
  </div>
  <div class="panel">
    <h3>Top 5 Selling Products</h3>
    <canvas id="topChart"></canvas>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
async function loadCharts() {
  const salesRes = await fetch("{{ url_for('api_sales_last7') }}");
  const sales = await salesRes.json();
  new Chart(document.getElementById('salesChart'), {
    type: 'line',
    data: { labels: sales.labels, datasets: [{ label: 'Sales (₹)', data: sales.values,
            borderColor: '#4f7cff', backgroundColor: 'rgba(79,124,255,0.15)', fill: true, tension: 0.3 }] }
  });

  const stockRes = await fetch("{{ url_for('api_stock_by_category') }}");
  const stock = await stockRes.json();
  new Chart(document.getElementById('stockChart'), {
    type: 'doughnut',
    data: { labels: stock.labels, datasets: [{ data: stock.values,
            backgroundColor: ['#4f7cff','#ff8a4f','#4fd18b','#ffd24f','#d14fff'] }] }
  });

  const topRes = await fetch("{{ url_for('api_top_products') }}");
  const top = await topRes.json();
  new Chart(document.getElementById('topChart'), {
    type: 'bar',
    data: { labels: top.labels, datasets: [{ label: 'Units Sold', data: top.values,
            backgroundColor: '#4f7cff' }] }
  });
}
loadCharts();
</script>
{% endblock %}
